apiVersion: apps/v1
kind: Deployment
metadata:
  name: hellojava-deployment
  labels:
    app: hellojava
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hellojava
  template:
    metadata:
      labels:
        app: hellojava
    spec:
      containers:
      - name: hellojava-container
        image: gsz116/hellojava:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: hellojava-service
spec:
  type: NodePort
  selector:
    app: hellojava
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80